version: '3.8'

services:
  # Aplicação Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitplan_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - fitplan
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=fitplan_academy
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Servidor Nginx
  nginx:
    image: nginx:alpine
    container_name: fitplan_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fitplan
    depends_on:
      - app

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: fitplan_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitplan_academy
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: fitplan
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - fitplan
    command: --default-authentication-plugin=mysql_native_password

  # Redis
  redis:
    image: redis:alpine
    container_name: fitplan_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    networks:
      - fitplan

  # phpMyAdmin (Gerenciador visual do MySQL)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fitplan_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - fitplan
    depends_on:
      - mysql

networks:
  fitplan:
    driver: bridge

volumes:
  mysql_data:
    driver: local
