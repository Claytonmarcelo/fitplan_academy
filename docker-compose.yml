version: '3.8'

services:
  # Aplicação Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitplan_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - fitplan
    depends_on:
      - postgres
      - redis

  # Servidor Nginx
  nginx:
    image: nginx:alpine
    container_name: fitplan_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - fitplan
    depends_on:
      - app

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: fitplan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitplan_academy
      POSTGRES_USER: fitplan
      POSTGRES_PASSWORD: fitplan123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Mudou para 5433 para evitar conflito
    networks:
      - fitplan

  # Redis
  redis:
    image: redis:alpine
    container_name: fitplan_redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Mudou para 6380 para evitar conflito
    networks:
      - fitplan

  # PgAdmin (Gerenciador visual do PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: fitplan_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fitplanacademy.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - fitplan
    depends_on:
      - postgres

networks:
  fitplan:
    driver: bridge

volumes:
  postgres_data:
    driver: local

