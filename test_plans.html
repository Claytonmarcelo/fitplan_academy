<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Planos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff6a00",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23170f",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background-light">
    <div class="container mx-auto px-4 py-16">
        <h1 class="text-3xl font-bold text-center mb-12">Teste dos Planos</h1>
        
        <div class="grid md:grid-cols-3 gap-8">
            <!-- Plano Basic -->
            <div class="bg-white border border-zinc-200 rounded-xl p-8 flex flex-col">
                <h3 class="text-xl font-bold text-zinc-900">Basic</h3>
                <p class="mt-2 mb-6">
                    <span class="text-5xl font-black text-zinc-900">R$ 99</span>
                    <span class="text-zinc-600">/mês</span>
                </p>
                <button class="w-full py-3 font-bold text-primary bg-primary/10 rounded-lg">Selecionar Plano</button>
                <ul class="mt-8 space-y-4 text-sm text-zinc-600">
                    <li class="flex items-center gap-3">
                        <svg class="text-primary size-5" fill="currentColor" viewBox="0 0 256 256"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>
                        Acesso à academia
                    </li>
                </ul>
            </div>

            <!-- Plano Smart (DESTACADO) -->
            <div class="bg-orange-500 text-white rounded-xl p-8 flex flex-col relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/20 rounded-full"></div>
                <div class="absolute bottom-4 left-4 w-16 h-16 bg-white/20 rounded-full"></div>
                
                <h3 class="text-xl font-bold text-white">Smart</h3>
                <p class="mt-2 mb-6">
                    <span class="text-5xl font-black text-white">R$ 149</span>
                    <span class="text-white">/mês</span>
                </p>
                <button class="w-full py-3 font-bold text-orange-500 bg-white rounded-lg hover:bg-gray-50">Selecionar Plano</button>
                <ul class="mt-8 space-y-4 text-sm text-white">
                    <li class="flex items-center gap-3">
                        <svg class="text-white size-5" fill="currentColor" viewBox="0 0 256 256"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>
                        Todas as funcionalidades do plano Basic
                    </li>
                </ul>
            </div>

            <!-- Plano Black -->
            <div class="bg-white border border-zinc-200 rounded-xl p-8 flex flex-col">
                <h3 class="text-xl font-bold text-zinc-900">Black</h3>
                <p class="mt-2 mb-6">
                    <span class="text-5xl font-black text-zinc-900">R$ 249</span>
                    <span class="text-zinc-600">/mês</span>
                </p>
                <button class="w-full py-3 font-bold text-primary bg-primary/10 rounded-lg">Selecionar Plano</button>
                <ul class="mt-8 space-y-4 text-sm text-zinc-600">
                    <li class="flex items-center gap-3">
                        <svg class="text-primary size-5" fill="currentColor" viewBox="0 0 256 256"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>
                        Todas as funcionalidades do plano Smart
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
